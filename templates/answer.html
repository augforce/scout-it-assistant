<div class="answer-block" data-request-id="{{ request_id }}">
  <div class="answer-meta">
    <span class="meta-label">YOU ASKED</span>
    <div class="question">{{ question }}</div>
  </div>

  <div class="answer-warnings-slot"></div>

  <div class="layout">
    <article class="answer">
      {% if has_results %}
      <div class="answer-body streaming"
           data-stream-url="/ask/stream/{{ request_id }}"
           data-finalize-url="/ask/finalize/{{ request_id }}"></div>
      {% else %}
      <div class="answer-body">No matching documents found in the index.</div>
      {% endif %}
    </article>

    <aside class="sources-slot"></aside>
  </div>
</div>
